name: Bug report
description: Report a reproducible defect in implemented behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; follow SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact commands, config, seed, and smallest legal fixture.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/version, OS, Python, backend, hardware, and dependency versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or artifacts
      description: Remove secrets, private data, proprietary CAD, and credentials.

